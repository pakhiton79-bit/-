<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена</title>
<style>
  :root { --bg: #f4f2ee; --ink: #1d1b19; --muted: #6b665f; --accent: #3b5bdb; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131417; --ink: #ecebe8; --muted: #9c9a95; --accent: #7c95ff; color-scheme: dark; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { margin: 0 0 12px; font-size: 64px; color: var(--accent); }
  p { color: var(--muted); }
  a { color: var(--accent); font-size: 18px; }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Такой страницы нет. Оба промолчали.</p>
    <p><a href="./">К симулятору</a></p>
  </main>
</body>
</html>
